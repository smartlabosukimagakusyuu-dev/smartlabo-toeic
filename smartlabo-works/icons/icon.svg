<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0A1B3D"/>

  <!-- Hexagon frame -->
  <polygon points="256,60 410,148 410,324 256,412 102,324 102,148"
    fill="none" stroke="url(#grad)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Circuit nodes on hexagon vertices -->
  <circle cx="256" cy="60"  r="9" fill="#00D4FF"/>
  <circle cx="410" cy="148" r="9" fill="#60A5FA"/>
  <circle cx="410" cy="324" r="9" fill="#60A5FA"/>
  <circle cx="256" cy="412" r="9" fill="#00D4FF"/>
  <circle cx="102" cy="324" r="9" fill="#60A5FA"/>
  <circle cx="102" cy="148" r="9" fill="#60A5FA"/>

  <!-- S-shape circuit paths -->
  <!-- Top horizontal bar of S -->
  <path d="M 175 185 L 300 185" stroke="url(#grad)" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Top-right curve area (upper) -->
  <path d="M 300 185 Q 345 185 345 225 Q 345 256 305 256 L 210 256"
    stroke="url(#grad)" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Middle bar -->
  <path d="M 210 256 L 305 256" stroke="#2563EB" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Bottom-left curve area (lower) -->
  <path d="M 210 256 Q 165 256 165 295 Q 165 327 212 327 L 337 327"
    stroke="url(#grad2)" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Bottom horizontal bar of S -->
  <path d="M 212 327 L 337 327" stroke="url(#grad2)" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Circuit nodes on S -->
  <circle cx="175" cy="185" r="7" fill="#00D4FF"/>
  <circle cx="300" cy="185" r="7" fill="#60A5FA"/>
  <circle cx="305" cy="256" r="7" fill="#2563EB"/>
  <circle cx="210" cy="256" r="7" fill="#2563EB"/>
  <circle cx="337" cy="327" r="7" fill="#60A5FA"/>
  <circle cx="212" cy="327" r="7" fill="#00D4FF"/>

  <!-- Sparkle star top-right -->
  <g transform="translate(370,110)">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>
</svg>
